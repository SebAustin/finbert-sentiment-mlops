# CI/CD for the FinBERT sentiment API.
#
#   lint ─┬─ test ───────┬─ build (ECR) ── deploy (ECS Fargate, "production" approval)
#         └─ deepchecks ─┘
#
# Required repository secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (Cloud Lab
#   credentials are temporary), AWS_REGION, ECR_REGISTRY
#   (<account>.dkr.ecr.<region>.amazonaws.com).
# AWS resources are created by infra/setup_aws.sh (see infra/README.md).
# Docs: https://docs.github.com/en/actions/writing-workflows

name: test-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments of main at the same time.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: finbert-api
  TASK_DEFINITION: finbert-api
  CONTAINER_NAME: finbert-api
  ECS_SERVICE: finbert-api-service
  ECS_CLUSTER: finbert-cluster
  PYTHON_VERSION: "3.12"
  HF_MODEL_ID: baptle/FinBERT_market_based
  HF_DATASET_ID: baptle/financial_headlines_market_based
  # CPU-only PyTorch: the default wheel drags ~3 GB of CUDA libraries.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.10"
      - run: ruff check app/ scripts/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    env:
      MODEL_SOURCE: huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-model-${{ env.HF_MODEL_ID }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url "$TORCH_INDEX_URL"
          pip install -r requirements.txt

      - name: Download and patch the model
        run: python scripts/smoke_test.py

      - name: Run integration tests
        run: pytest tests/ -v

  deepchecks:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    env:
      MODEL_SOURCE: huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace model and dataset
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/huggingface/datasets
          key: hf-model-data-${{ env.HF_MODEL_ID }}-${{ hashFiles('params.yaml') }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url "$TORCH_INDEX_URL"
          pip install -r requirements.txt

      - name: Download and patch the model
        run: python scripts/smoke_test.py

      - name: Generate data with DVC
        run: dvc repro

      - name: Run Deepchecks drift gate
        run: python scripts/run_deepchecks.py

  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [test, deepchecks]
    timeout-minutes: 30
    # Only the tag crosses jobs: GitHub drops job outputs that contain a
    # secret, and the registry comes from secrets.ECR_REGISTRY.
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: meta
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          TAG="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)"
          {
            echo "tag=$TAG"
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"
            echo "latest=$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build the Docker image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          LATEST: ${{ steps.meta.outputs.latest }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" -t "$LATEST" .

      - name: Push the image to Amazon ECR
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          LATEST: ${{ steps.meta.outputs.latest }}
        run: |
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "Pushed $ECR_REPOSITORY:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    # Manual approval gate: add required reviewers to the "production"
    # environment (Settings → Environments) so every deploy waits for sign-off.
    environment:
      name: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Render task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.tag }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          desired-count: 1
          wait-for-service-stability: true
          wait-for-minutes: 20

      - name: Summary
        run: |
          echo "Deployed $ECR_REPOSITORY:${{ needs.build.outputs.tag }} to $ECS_CLUSTER/$ECS_SERVICE" >> "$GITHUB_STEP_SUMMARY"
